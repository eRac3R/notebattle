# Local dev/test database. The app runs without it (in-memory repo) when DATABASE_URL is unset.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notebattle
      POSTGRES_PASSWORD: notebattle
      POSTGRES_DB: notebattle
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebattle"]
      interval: 2s
      retries: 20
